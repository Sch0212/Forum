<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Arena Sport</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">ARENA<span>SPORT</span></a>
        <a href="/" class="back-link">⬅ Retour à l'arène</a>
    </nav>

    <main class="container">
        <div class="form-card fade-in">
            <h1>Se connecter</h1>
            <p style="color: #a1a1aa; margin-bottom: 2rem;">Retour à l'entraînement.</p>
            
            <form action="/login" method="POST">
                <div class="input-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" placeholder="athlete@email.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Connexion</button>
            </form>
        </div>
    </main>
    <script src="/static/js/script.js"></script>
</body>
</html>
